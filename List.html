   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <script>
     // --- GLOBAL VARIABLES ---
     var allData = [];
     var filteredData = [];
     var globalHeaders = [];
     var currentPage = 1;
     var rowsPerPage = 100;
     var currentRowBeingEdited = null;
     var originalHTML = "";
     var satkerLookupList = [];

     window.onload = function() { loadData(); };

     // ==========================================
     //        DATA LOADING & RENDERING
     // ==========================================
     function loadData() {
       allData = []; filteredData = []; currentPage = 1;
       updatePaginationControls();
       document.getElementById("tableBody").innerHTML = `<tr><td colspan="100%" class="text-center p-5">Loading Data... <i class="fas fa-spinner fa-spin"></i></td></tr>`;
       var selectedSheet = document.getElementById("sheetSelector").value;
       google.script.run.withSuccessHandler(initialRender).getData(selectedSheet);
     }

     function initialRender(data) {
       if (typeof data === 'string') {
          document.getElementById("tableBody").innerHTML = `<tr><td colspan="100%" class="text-center text-danger p-5">${data}</td></tr>`; return;
       }
       if (!data || data.length === 0) {
         document.getElementById("tableBody").innerHTML = `<tr><td colspan="100%" class="text-center p-5">Data Empty</td></tr>`; return;
       }

       globalHeaders = data[0];
       allData = [];
       // Start from 1 to skip Header row in Sheet
       for (var i = 1; i < data.length; i++) {
         allData.push({ values: data[i], sheetRow: i + 1, originalRowIndex: i + 1 });
       }
       filteredData = allData;
       renderHeader(globalHeaders);
       populateDynamicYears(); // <--- NEW: Populate Date Filter
       renderTableBody();
     }

     function populateDynamicYears() {
        var sheetSelector = document.getElementById("sheetSelector");
        var currentSheet = sheetSelector.value;
        var yearSelect = document.getElementById("yearFilter");
        
        // Determine Date Column Index (0-based)
        // Pengelolaan & PSP = Col C (Index 2)
        // Evakin = Col F (Index 5)
        var dateColIndex = (currentSheet === "monitoring_evakin") ? 5 : 2;

        var uniqueYears = new Set();
        allData.forEach(function(rowObj) {
            var cellVal = rowObj.values[dateColIndex];
            if (cellVal) {
                var d = null;
                if (cellVal instanceof Date) d = cellVal;
                else if (typeof cellVal === 'string' && cellVal.match(/^\d{4}-\d{2}-\d{2}/)) d = new Date(cellVal);
                
                if (d && !isNaN(d.getTime())) uniqueYears.add(d.getFullYear());
            }
        });

        var sortedYears = Array.from(uniqueYears).sort((a, b) => b - a);
        var currentSelection = yearSelect.value;
        
        yearSelect.innerHTML = '<option value="">- Tahun -</option>';
        sortedYears.forEach(y => { yearSelect.innerHTML += `<option value="${y}">${y}</option>`; });
        
        if (currentSelection && sortedYears.includes(Number(currentSelection))) yearSelect.value = currentSelection;
     }

     function renderHeader(headers) {
       var headerRow = document.getElementById("headerRow");
       var filterRow = document.getElementById("filterRow");
       headerRow.innerHTML = `<th style="width: 50px;">No</th>`;
       filterRow.innerHTML = `<th></th>`;

       for (var h = 1; h < headers.length; h++) {
         headerRow.innerHTML += `<th>${headers[h]}</th>`;
         filterRow.innerHTML += `<th><input type="text" class="filter-input" placeholder="Search..." onkeyup="filterData()"></th>`;
       }
       headerRow.innerHTML += `<th class="text-center" style="width: 100px;">Action</th>`;
       filterRow.innerHTML += `<th></th>`;
     }

     function renderTableBody() {
       var tbody = document.getElementById("tableBody");
       tbody.innerHTML = "";
       if (filteredData.length === 0) {
         tbody.innerHTML = `<tr><td colspan="100%" class="text-center">No matching records found</td></tr>`;
         updatePaginationControls(); return;
       }

       var startIndex = (currentPage - 1) * rowsPerPage;
       var endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
       var pageData = filteredData.slice(startIndex, endIndex);
       var currentSheet = document.getElementById("sheetSelector").value;

       // Setup for Tinjut Highlight
       var tinjutHeaderIndex = -1;
       if (currentSheet === "monitoring_pengelolaan") {
           for(var i=1; i<globalHeaders.length; i++) {
               if(globalHeaders[i].toString().toLowerCase().includes("status tinjut")) { tinjutHeaderIndex = i; break; }
           }
       }

       pageData.forEach((rowObj, index) => {
         var row = rowObj.values;
         var rowIndex = rowObj.sheetRow;
         var tr = document.createElement("tr");
         var displayNum = startIndex + index + 1;

         // Row Completion Logic (Green)
         var isRowCompleted = false;
         if (currentSheet === "monitoring_evakin") {
            if (row[9] && String(row[9]).trim() !== "" && row[10] && String(row[10]).trim() !== "") isRowCompleted = true;
         } else if (tinjutHeaderIndex !== -1) {
             var val = String(row[tinjutHeaderIndex] || "").trim().toUpperCase();
             if (val === "V") isRowCompleted = true;
         }

         var greenClass = isRowCompleted ? "cell-green" : "";
         tr.innerHTML += `<td class="text-center fw-bold ${greenClass}">${displayNum}</td>`;

         for (var c = 1; c < row.length; c++) {
            var cellVal = row[c];
            var lowerHeader = globalHeaders[c] ? globalHeaders[c].toString().toLowerCase() : "";
            var displayVal = cellVal;
            var cellGreenClass = "";
            
            if (currentSheet === "monitoring_evakin" && isRowCompleted) cellGreenClass = "cell-green";
            else if (currentSheet === "monitoring_pengelolaan" && isRowCompleted && tinjutHeaderIndex !== -1 && c <= tinjutHeaderIndex) cellGreenClass = "cell-green";

            if (lowerHeader.includes("status tinjut")) {
               var isChecked = (String(cellVal).trim().toUpperCase() === "V");
               displayVal = isChecked ? `<span class="badge bg-success">Selesai</span>` : `<span class="text-muted">-</span>`;
               tr.innerHTML += `<td class="tinjut-cell ${cellGreenClass}" data-val="${cellVal}">${displayVal}</td>`;
            } else if (lowerHeader.includes("setoran pnbp")) {
               var num = Number(String(cellVal).replace(/[^0-9]/g, ""));
               var fmt = (!isNaN(num) && cellVal !== "") ? "Rp " + num.toLocaleString('id-ID') : "Rp 0";
               tr.innerHTML += `<td class="pnbp-cell ${cellGreenClass}" data-val="${num}">${fmt}</td>`;
            } else if (cellVal && (typeof cellVal === 'string' && cellVal.match(/^\d{4}-\d{2}-\d{2}/) || cellVal instanceof Date)) {
               var d = (cellVal instanceof Date) ? cellVal : new Date(cellVal);
               var dateStr = (!isNaN(d)) ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` : cellVal;
               tr.innerHTML += `<td class="${cellGreenClass}">${dateStr}</td>`;
            } else if (lowerHeader.includes("nilai") && cellVal) {
               var num = Number(cellVal);
               if (!isNaN(num)) displayVal = "Rp " + num.toLocaleString('id-ID');
               tr.innerHTML += `<td class="${cellGreenClass}">${displayVal}</td>`;
            } else if ((lowerHeader.includes("link") || lowerHeader.includes("sharepoint")) && cellVal) {
               displayVal = String(cellVal).startsWith("http") ? `<a href="${cellVal}" target="_blank"><i class="fas fa-external-link-alt"></i> Link</a>` : cellVal;
               tr.innerHTML += `<td class="${cellGreenClass}"><div class="cell-truncate" title="${cellVal}">${displayVal}</div></td>`;
            } else {
               tr.innerHTML += `<td class="${cellGreenClass}">${cellVal}</td>`;
            }
         }

         // Action Buttons
         var deleteBtn = "";
         if (currentSheet === "monitoring_evakin") {
            deleteBtn = `<button class="btn btn-danger btn-sm ms-1 btn-delete" onclick="deleteEvakinData(this, ${rowIndex})" title="Delete"><i class="fas fa-trash"></i></button>`;
         }
         
         // Checklist Button (if needed for viewing)
         var checklistBtn = "";
         // Column 17 (Index 17) usually holds JSON in Manage, here we check index 17
         if (row[17] && String(row[17]).trim().startsWith("{")) {
            checklistBtn = `<button class="btn btn-secondary btn-sm ms-1" onclick="viewChecklist('${encodeURIComponent(row[17])}', ${rowIndex})" title="View Checklist"><i class="fas fa-list"></i></button>`;
         }

         tr.innerHTML += `
           <td class="text-center ${greenClass}" style="white-space:nowrap;">
             <button class="btn btn-warning btn-sm btn-edit" onclick="editRow(this, ${rowIndex})" title="Edit"><i class="fas fa-pen"></i></button>
             ${deleteBtn}
             ${checklistBtn}
             <div class="action-buttons d-none">
               <button class="btn btn-success btn-sm me-1" onclick="saveRow(this, ${rowIndex})" title="Save"><i class="fas fa-check"></i></button>
               <button class="btn btn-secondary btn-sm" onclick="cancelEdit(this)" title="Cancel"><i class="fas fa-times"></i></button>
             </div>
           </td>`;
         tbody.appendChild(tr);
       });
       updatePaginationControls();
     }

     // ==========================================
     //        FILTERING (TEXT + YEAR/SEM)
     // ==========================================
     // 1. HELPER: ROBUST DATE PARSER (Handles Text & Date Objects)
     function parseAnyDate(value) {
       if (!value) return null;
       
       // If it's already a Date object (from Google Sheets)
       if (value instanceof Date) return value;
       
       var str = String(value).trim();
       
       // Handle ISO Format (YYYY-MM-DD)
       if (str.match(/^\d{4}-\d{2}-\d{2}/)) {
         return new Date(str);
       }
       
       // Handle Indonesian/Excel Text Format (DD/MM/YYYY or DD-MM-YYYY)
       // Example: "25/12/2024" or "25-12-2024"
       if (str.match(/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}/)) {
         var parts = str.split(/[\/\-]/); // Split by / or -
         var day = parseInt(parts[0], 10);
         var month = parseInt(parts[1], 10) - 1; // JS months are 0-11
         var year = parseInt(parts[2], 10);
         var d = new Date(year, month, day);
         if (!isNaN(d.getTime())) return d;
       }
       
       return null;
     }

     // 2. UPDATED POPULATE FUNCTION
     function populateDynamicYears() {
        var sheetSelector = document.getElementById("sheetSelector");
        var currentSheet = sheetSelector.value;
        var yearSelect = document.getElementById("yearFilter");
        
        // Evakin = Col F (Index 5), Others = Col C (Index 2)
        var dateColIndex = (currentSheet === "monitoring_evakin") ? 5 : 2;

        var uniqueYears = new Set();
        
        allData.forEach(function(rowObj) {
            var cellVal = rowObj.values[dateColIndex];
            // Use the new robust parser
            var d = parseAnyDate(cellVal);
            
            if (d && !isNaN(d.getTime())) {
              uniqueYears.add(d.getFullYear());
            }
        });

        var sortedYears = Array.from(uniqueYears).sort((a, b) => b - a);
        var currentSelection = yearSelect.value;
        
        yearSelect.innerHTML = '<option value="">- Tahun -</option>';
        sortedYears.forEach(y => { yearSelect.innerHTML += `<option value="${y}">${y}</option>`; });
        
        // Restore selection if valid
        if (currentSelection && sortedYears.includes(Number(currentSelection))) {
            yearSelect.value = currentSelection;
        }
     }

     // 3. UPDATED FILTER FUNCTION
     function filterData() {
       var inputs = document.getElementsByClassName("filter-input");
       var textFilters = [];
       // We push Uppercase values to array
       for(var i=0; i<inputs.length; i++) textFilters.push(inputs[i].value.toUpperCase());
       
       var yearVal = document.getElementById("yearFilter").value;
       var semVal = document.getElementById("semesterFilter").value;
       var currentSheet = document.getElementById("sheetSelector").value;
       
       var dateColIndex = (currentSheet === "monitoring_evakin") ? 5 : 2;

       filteredData = allData.filter(function(rowObj) {
          var row = rowObj.values;
          
          // A. Text Search Filter
          for (var c = 1; c < row.length; c++) {
             var f = textFilters[c-1]; // Get filter value for this column
             
             if (f) {
                 var cellData = String(row[c]).toUpperCase();

                 // --- MODIFIED LOGIC START ---
                 // Specific Rule: Monitoring PSP + Column H (Index 7) = EXACT MATCH
                 if (currentSheet === "monitoring_psp" && c === 7) {
                     // We trim both sides to ensure clean comparison
                     if (cellData.trim() !== f.trim()) return false;
                 } 
                 // Default Rule: All other columns/sheets = PARTIAL MATCH (Contains)
                 else {
                     if (cellData.indexOf(f) === -1) return false;
                 }
                 // --- MODIFIED LOGIC END ---
             }
          }

          // B. Date Filter (Year/Semester) - (UNCHANGED)
          if (yearVal || semVal) {
             var cellValue = row[dateColIndex];
             var d = parseAnyDate(cellValue);
             
             if (!d) return false;

             var rowYear = d.getFullYear().toString();
             var rowMonth = d.getMonth(); 

             if (yearVal && rowYear !== yearVal) return false;
             
             if (semVal) {
                // Sem 1: Jan(0) - Jun(5)
                if (semVal === "1" && rowMonth > 5) return false;
                // Sem 2: Jul(6) - Dec(11)
                if (semVal === "2" && rowMonth <= 5) return false;
             }
          }
          return true;
       });
       
       currentPage = 1; 
       renderTableBody();
     }

     // ==========================================
     //        EDIT / SAVE / DELETE ROW
     // ==========================================
     function editRow(btn, rowIndex) {
       if (currentRowBeingEdited) cancelEdit(currentRowBeingEdited.querySelector('.btn-secondary'));
       var tr = btn.closest("tr");
       currentRowBeingEdited = tr;
       originalHTML = tr.innerHTML;
       tr.querySelector('.btn-edit').classList.add('d-none');
       var delBtn = tr.querySelector('.btn-delete'); if(delBtn) delBtn.classList.add('d-none');
       tr.querySelector('.action-buttons').classList.remove('d-none');
       
       var currentSheet = document.getElementById("sheetSelector").value;

       // --- 1. EVAKIN LOGIC ---
       if (currentSheet === "monitoring_evakin") {
           var cellNo = tr.cells[9]; var cellTgl = tr.cells[10];
           var oldNo = cellNo.innerText.trim(); if(oldNo === "-") oldNo = "";
           cellNo.innerHTML = `<input type="text" id="edit-no-tinjut-${rowIndex}" class="form-control form-control-sm" value="${oldNo}">`;
           
           var oldTgl = cellTgl.innerText.trim(); var iso = "";
           if(oldTgl.includes("/")) { var p = oldTgl.split("/"); iso = `${p[2]}-${p[1]}-${p[0]}`; }
           cellTgl.innerHTML = `<input type="date" id="edit-tgl-tinjut-${rowIndex}" class="form-control form-control-sm" value="${iso}">`;
       } 
       // --- 2. PSP & PENGELOLAAN LOGIC ---
       else {
           // A. Edit PNBP
           var pnbpTd = tr.querySelector('.pnbp-cell');
           if (pnbpTd) {
               var oldVal = pnbpTd.getAttribute('data-val');
               var display = (oldVal == 0 || isNaN(oldVal)) ? "" : oldVal;
               if(display) display = "Rp " + Number(display).toLocaleString('id-ID');
               pnbpTd.innerHTML = `<input type="text" class="edit-input" id="edit-pnbp-${rowIndex}" value="${display}" placeholder="Rp 0" onkeyup="formatRupiah(this)">`;
           }
           
           // B. Edit Tinjut
           var tinjutTd = tr.querySelector('.tinjut-cell');
           if (tinjutTd) {
               var isChecked = (String(tinjutTd.getAttribute('data-val')).trim().toUpperCase() === "V");
               tinjutTd.innerHTML = `<div class="d-flex justify-content-center"><input type="checkbox" class="form-check-input" id="edit-tinjut-${rowIndex}" ${isChecked ? "checked" : ""}></div>`;
           }

           // C. NEW: Edit Column O (Jmlh NUP) ONLY for PSP + Specific Condition
           if (currentSheet === "monitoring_psp") {
               // Column H = Index 7 ("Jenis BMN")
               // Column O = Index 14 ("Jmlh NUP TB")
               var cellJenis = tr.cells[7];
               var cellNup = tr.cells[14];

               if (cellJenis && cellNup) {
                   var jenisText = cellJenis.innerText.trim().toLowerCase();
                   
                   // Strict check for "tanah dan/atau bangunan"
                   if (jenisText === "tanah dan/atau bangunan") {
                       var oldNup = cellNup.innerText.trim();
                       cellNup.innerHTML = `<input type="number" class="form-control form-control-sm" id="edit-nup-${rowIndex}" value="${oldNup}" style="width: 80px;">`;
                   }
               }
           }
       }
     }
     function saveRow(btn, rowIndex) {
       var tr = btn.closest("tr");
       var sheetName = document.getElementById("sheetSelector").value;
       btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

       if (sheetName === "monitoring_evakin") {
           var no = document.getElementById(`edit-no-tinjut-${rowIndex}`).value;
           var tgl = document.getElementById(`edit-tgl-tinjut-${rowIndex}`).value;
           google.script.run.withSuccessHandler(res => {
               if(res === "Success") loadData(); else { alert(res); cancelEdit(btn); }
           }).updateEvakinRow(rowIndex, no, tgl);
       } else {
           var pnbp = document.getElementById(`edit-pnbp-${rowIndex}`);
           var tinjut = document.getElementById(`edit-tinjut-${rowIndex}`);
           // Get NUP Input (May be null if row wasn't editable)
           var nupInput = document.getElementById(`edit-nup-${rowIndex}`);

           var valPnbp = pnbp ? pnbp.value.replace(/[^0-9]/g, "") : "0";
           var valTinjut = (tinjut && tinjut.checked) ? "V" : "";
           
           // If input exists, get value. If not, send null (Backend ignores null)
           var valNup = nupInput ? nupInput.value : null;

           google.script.run.withSuccessHandler(res => {
               if(res === "Success") loadData(); else { alert(res); cancelEdit(btn); }
           }).updateDashboardRow(sheetName, rowIndex, valPnbp, valTinjut, valNup);
       }
     }
     function cancelEdit(btn) {
       if(currentRowBeingEdited) { currentRowBeingEdited.innerHTML = originalHTML; currentRowBeingEdited = null; }
     }

     function deleteEvakinData(btn, rowIndex) {
       if (!confirm("Hapus baris ini?")) return;
       var orig = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
       google.script.run.withSuccessHandler(res => {
         if (res === "Success") loadData(); else { alert(res); btn.innerHTML = orig; btn.disabled = false; }
       }).deleteEvakinRow(rowIndex);
     }

     // ==========================================
     //        SATKER MODAL LOGIC
     // ==========================================
     function openSatkerModal() {
       var myModal = new bootstrap.Modal(document.getElementById('satkerModal'));
       myModal.show();
       if (satkerLookupList.length === 0) {
         document.getElementById("searchNama").placeholder = "Memuat database...";
         google.script.run.withSuccessHandler(d => {
           satkerLookupList = d; document.getElementById("searchNama").placeholder = "Ketik Nama Satker...";
         }).getSatkerLookupList();
       }
     }

     function handleCodeSearch(input) {
       var val = input.value.trim();
       var list = document.getElementById("satkerSuggestions"); list.innerHTML = "";
       if (val.length < 2) { list.style.display = "none"; return; }
       var matches = satkerLookupList.filter(item => item.code.indexOf(val) !== -1);
       renderSuggestions(matches, list);
     }

     function handleNameSearch(input) {
       var val = input.value.toLowerCase();
       var list = document.getElementById("satkerSuggestions"); list.innerHTML = "";
       if (val.length < 3) { list.style.display = "none"; return; }
       var matches = satkerLookupList.filter(item => item.name.toLowerCase().includes(val));
       renderSuggestions(matches, list);
     }

     function renderSuggestions(matches, list) {
       if (matches.length > 0) {
         list.style.display = "block";
         matches.slice(0, 10).forEach(item => {
           var li = document.createElement("li"); li.className = "suggestion-item";
           li.innerHTML = `<strong>${item.code}</strong> - ${item.name}`;
           li.onclick = function() { selectSatker(item.code, item.name); };
           list.appendChild(li);
         });
       } else { list.style.display = "none"; }
     }

     function selectSatker(code, name) {
       document.getElementById("satkerSuggestions").style.display = "none";
       document.getElementById("searchNama").value = name;
       document.getElementById("searchKode").value = code;
       document.getElementById("satkerForm").style.display = "none";
       document.getElementById("satkerLoading").style.display = "block";
       google.script.run.withSuccessHandler(d => {
         document.getElementById("satkerLoading").style.display = "none";
         if (d.found) {
           document.getElementById("satkerForm").style.display = "block";
           document.getElementById("editKodeSatker").value = code;
           document.getElementById("editNamaSatker").value = name;
           document.getElementById("editKL").value = d.kl || "";
           document.getElementById("editPimpinan").value = d.pimpinanKl || "";
           document.getElementById("editPimpinanSatker").value = d.pimpinanSatker || "";
           document.getElementById("editAlamat").value = d.alamat || "";
           document.getElementById("editPic").value = d.pic || "";
           document.getElementById("editTelp").value = d.telp || "";
         } else { alert("Data satker tidak ditemukan."); }
       }).getSatkerDetails(code);
     }

     function clearSatkerForm() {
       document.getElementById("satkerForm").reset();
       document.getElementById("searchKode").value = "";
       document.getElementById("searchNama").value = "";
       document.getElementById("satkerForm").style.display = "none";
     }

     function saveSatkerData(e) {
       e.preventDefault();
       var form = document.getElementById("satkerForm");
       var btn = form.querySelector("button[type='submit']");
       var originalText = btn.innerHTML;
       btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; btn.disabled = true;
       google.script.run.withSuccessHandler(res => {
         alert(res); btn.innerHTML = originalText; btn.disabled = false;
       }).updateSatkerDetails(form);
     }

     function contactWA() {
       var phone = document.getElementById("editTelp").value;
       if (!phone) { alert("Nomor telepon kosong!"); return; }
       var clean = phone.replace(/\D/g, '');
       if (clean.startsWith("0")) clean = "62" + clean.substring(1);
       window.open("https://wa.me/" + clean, "_blank");
     }

     // ==========================================
     //        CHECKLIST LOGIC (VIEW ONLY)
     // ==========================================
     function viewChecklist(encodedJson, rowIndex) {
       try {
         var data = JSON.parse(decodeURIComponent(encodedJson));
         document.getElementById("checklistRowIndex").value = rowIndex;
         var listContainer = document.getElementById("previewList");
         listContainer.innerHTML = "";
         
         if (data.items && data.items.length > 0) {
           data.items.forEach(function(item) {
             var name = (typeof item === 'object') ? item.name : String(item);
             var isChecked = (typeof item === 'object') ? item.checked : true;
             
             var li = document.createElement("li");
             li.className = "list-group-item d-flex align-items-center border-0 px-0 mb-1";
             li.innerHTML = `
                 <div class="form-check me-2">
                   <input class="form-check-input modal-checklist-checkbox" type="checkbox" ${isChecked ? "checked" : ""} disabled>
                 </div>
                 <input type="text" class="form-control form-control-sm border-0 border-bottom modal-checklist-text flex-grow-1 bg-white" value="${name}" readonly>
             `;
             listContainer.appendChild(li);
           });
         } else {
             listContainer.innerHTML = "<li class='list-group-item'>- Tidak ada item -</li>";
         }
         document.getElementById("previewNotes").value = data.notes || "";
         var myModal = new bootstrap.Modal(document.getElementById('checklistPreviewModal'));
         myModal.show();
       } catch (e) { alert("Error reading checklist: " + e.message); }
     }

     function copyChecklistToClipboard() {
       var rowIndexInput = document.getElementById("checklistRowIndex");
       if (!rowIndexInput || !rowIndexInput.value) { alert("Error: Index tidak ditemukan."); return; }
       
       var sheetRow = parseInt(rowIndexInput.value);
       var rowObj = allData.find(item => item.originalRowIndex === sheetRow);
       if (!rowObj) { alert("Error: Data tidak ditemukan di memori."); return; }
       
       var val = rowObj.values;
       // Arrays are 0-indexed: Col F=5, H=7, M=12
       var kodeSatker = val[5] || "-"; 
       var jenis = val[7] || "-"; 
       var tiket = val[12] || "-";
       var satkerName = val[6] || "";

       var text = `*CHECKLIST PERSYARATAN DOKUMEN*\n-----------------------------------\n`;
       text += `*Jenis* : ${jenis}\n*No. Tiket SIMAN* : ${tiket}\n*Satker* : ${kodeSatker}\n`;
       if (satkerName) text += `          ${satkerName}\n`;
       text += `-----------------------------------\n`;

       var listItems = document.getElementById("previewList").querySelectorAll("li");
       if (listItems.length === 0) text += "(Kosong)\n";
       
       listItems.forEach(li => {
          var cb = li.querySelector(".modal-checklist-checkbox");
          var txt = li.querySelector(".modal-checklist-text");
          if(cb && txt) text += `${cb.checked ? "[v]" : "[ ]"} ${txt.value}\n`;
       });
       
       var notes = document.getElementById("previewNotes").value;
       if(notes) text += `-----------------------------------\n*Catatan*: ${notes}\n`;

       navigator.clipboard.writeText(text).then(() => {
          var btn = document.querySelector("button[onclick='copyChecklistToClipboard()']");
          var orig = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
          btn.classList.replace("btn-outline-secondary", "btn-success");
          setTimeout(() => { 
             btn.innerHTML = orig; 
             btn.classList.replace("btn-success", "btn-outline-secondary"); 
          }, 1500);
       });
     }

     function updatePaginationControls() {
       var totalRows = filteredData.length;
       var totalPages = Math.ceil(totalRows / rowsPerPage);
       var paginationUl = document.getElementById("paginationControls");
       var pageInfo = document.getElementById("pageInfo");
       var start = (currentPage - 1) * rowsPerPage + 1;
       var end = Math.min(currentPage * rowsPerPage, totalRows);
       if(totalRows === 0) { start = 0; end = 0; }
       pageInfo.innerText = `Showing ${start} to ${end} of ${totalRows} entries`;
       
       var html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" onclick="changePage(${currentPage - 1})">Previous</a></li>`;
       var startPage = Math.max(1, currentPage - 2);
       var endPage = Math.min(totalPages, currentPage + 2);
       for (var p = startPage; p <= endPage; p++) {
         html += `<li class="page-item ${p === currentPage ? 'active' : ''}"><a class="page-link" onclick="changePage(${p})">${p}</a></li>`;
       }
       html += `<li class="page-item ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}"><a class="page-link" onclick="changePage(${currentPage + 1})">Next</a></li>`;
       paginationUl.innerHTML = html;
     }

     function changePage(n) {
       var total = Math.ceil(filteredData.length / rowsPerPage);
       if (n < 1 || n > total) return;
       currentPage = n; renderTableBody();
     }

     function formatRupiah(element) {
       var value = element.value.replace(/\D/g, "");
       var rupiah = value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
       element.value = "Rp " + rupiah;
     }
